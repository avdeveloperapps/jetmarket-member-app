plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    // END: FlutterFire Configuration
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def releaseStoreFilePath = keystoreProperties.getProperty('storeFile')
def releaseStoreFile = releaseStoreFilePath ? file(releaseStoreFilePath) : null
def hasReleaseSigning = [
    'keyAlias',
    'keyPassword',
    'storeFile',
    'storePassword',
].every { keystoreProperties.getProperty(it)?.trim() } && releaseStoreFile?.isFile()
def allowDebugReleaseSigning = localProperties.getProperty(
    'jetmarket.allowDebugReleaseSigning',
    'false',
).toBoolean()
def isReleaseBuildRequested = gradle.startParameter.taskNames.any {
    it.toLowerCase().contains('release')
}

if (isReleaseBuildRequested && !hasReleaseSigning && !allowDebugReleaseSigning) {
    throw new GradleException(
        'Release keystore tidak tersedia. Isi android/key.properties untuk build produksi, ' +
        'atau aktifkan jetmarket.allowDebugReleaseSigning=true di android/local.properties ' +
        'khusus untuk APK pengujian lokal.'
    )
}

if (isReleaseBuildRequested && !hasReleaseSigning && allowDebugReleaseSigning) {
    logger.warn('PERINGATAN: APK release ditandatangani dengan debug key dan hanya boleh digunakan untuk pengujian lokal.')
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "com.jetmarket.customer"
    compileSdkVersion 36
    ndkVersion "28.0.13004108"

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile releaseStoreFile
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.jetmarket.customer"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    buildTypes {
        release {
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}
