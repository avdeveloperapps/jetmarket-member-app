buildscript {
    ext.kotlin_version = '2.2.20'
    ext.google_play_services_version = '4.4.0'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.11.1'
        // START: FlutterFire Configuration
        classpath 'com.google.gms:google-services:4.4.0'
        // END: FlutterFire Configuration
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

// Avoid build failures when dependencies add -Werror; also suppress obsolete
// source/target option warnings from Android dependencies on newer toolchains.
gradle.projectsEvaluated {
    subprojects {
        tasks.withType(JavaCompile).configureEach {
            options.compilerArgs.removeAll(["-Werror"])
            options.compilerArgs += ["-Xlint:-options"]
        }

        if (plugins.hasPlugin("com.android.application") || plugins.hasPlugin("com.android.library")) {
            def javaTarget = android.compileOptions.targetCompatibility.toString()
            tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                kotlinOptions {
                    jvmTarget = javaTarget
                }
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
